---
apiVersion: v1
kind: Service
metadata:
  annotations:
    lbipam.cilium.io/ips: 192.168.90.250
  labels:
    kubevirt.io/domain: ceph3
  name: ceph3
spec:
  externalTrafficPolicy: Local
  ports:
    - name: ssh
      port: 22
      protocol: TCP
      targetPort: 22
  selector:
    kubevirt.io/domain: ceph3
  type: LoadBalancer

