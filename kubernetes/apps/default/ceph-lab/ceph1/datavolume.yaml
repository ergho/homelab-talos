---
apiVersion: cdi.kubevirt.io/v1beta1
kind: DataVolume
metadata:
  name: ceph1-root
  namespace: default
spec:
  source:
    pvc:
      name: ubuntu-golden-image
      namespace: default
  pvc:
    storageClassName: openebs-hostpath
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: 20Gi
